
name: Build Antonyhern16 Game Space APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          set -e
          mkdir project
          unzip -q Antonyhern16-GameSpace-Build-Ready.zip -d project
          test -f project/base/Antonyhern16_CODM_Training.apk
          test -f project/patch/patch_manifest.py

      - name: Install Android packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt python3-pip
          curl -L --fail -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          pip install --user cryptography

      - name: Compile feature code
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PLATFORM="$(find "$SDK/platforms" -mindepth 1 -maxdepth 1 -type d -name 'android-*' | sort -V | tail -1)"
          mkdir classes dexout
          find project/patch/java -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -cp "$PLATFORM/android.jar" -d classes
          "$BT/d8" --lib "$PLATFORM/android.jar" --min-api 23 --output dexout $(find classes -name '*.class')
          echo "BT=$BT" >> "$GITHUB_ENV"

      - name: Rebuild APK
        run: |
          set -e
          java -jar apktool.jar d -f -o decoded project/base/Antonyhern16_CODM_Training.apk
          python3 project/patch/patch_manifest.py decoded/AndroidManifest.xml
          java -jar apktool.jar b decoded -o rebuilt.apk
          mkdir extracted
          unzip -q rebuilt.apk -d extracted
          N=$(find extracted -maxdepth 1 -regextype posix-extended -regex '.*/classes[0-9]*\.dex' | wc -l)
          cp dexout/classes.dex "extracted/classes$((N+1)).dex"
          python3 project/patch/mkapk2.py extracted Antonyhern16-GameSpace-Enhanced.apk project/patch/ci-signing-key.pem
          "$BT/apksigner" verify --verbose Antonyhern16-GameSpace-Enhanced.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Antonyhern16-GameSpace-Enhanced-APK
          path: Antonyhern16-GameSpace-Enhanced.apk
